<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Señores Pasajeros</title>
<meta name="description" content="Músicos ambulantes sobreviviendo a la ciudad. Beat 'em up para 1 o 2 jugadores.">
<meta property="og:title" content="Señores Pasajeros">
<meta property="og:description" content="Músicos ambulantes sobreviviendo a la ciudad.">
<meta property="og:image" content="cover.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b1a; color: #e9e4d4; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; }
  #game-root { width: min(100vw, calc((100vh - 96px) * 4 / 3)); aspect-ratio: 4 / 3; }
  .keys { display: flex; flex-wrap: wrap; gap: 4px 28px; justify-content: center; padding: 10px 16px; text-align: center; }
  .keys b { color: #ffd76a; }
  #pad { display: none; }
  /* teléfonos y tablets: sin ayuda de teclado, con palanca y botones en pantalla */
  .touch, .touch body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  .touch * { touch-action: none; }
  .touch body { position: fixed; inset: 0; }
  .touch #game-root { width: min(100vw, calc(100dvh * 4 / 3)); }
  .touch .keys { display: none; }
  .touch #pad { display: block; }
  #joy, .btn { position: fixed; border-radius: 50%; box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #joy { left: max(14px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); width: 136px; height: 136px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.4); }
  #knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 50%; background: rgba(255,215,106,.85); border: 2px solid #2a0e08; pointer-events: none; }
  .btn { width: 72px; height: 72px; border: 2px solid #2a0e08; color: #2a0e08; font: bold 11px ui-monospace, Menlo, monospace; display: flex; align-items: center; justify-content: center; opacity: .85; }
  .btn.on { opacity: 1; transform: scale(.92); }
  #b1 { right: max(14px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); background: #ffb22e; }
  #b2 { right: calc(max(14px, env(safe-area-inset-right)) + 82px); bottom: max(14px, env(safe-area-inset-bottom)); background: #7ad7ff; }
  #b3 { right: calc(max(14px, env(safe-area-inset-right)) + 30px); bottom: calc(max(22px, env(safe-area-inset-bottom)) + 82px); background: #ff9af0; }
  #bs { right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); width: auto; height: 34px; padding: 0 14px; border-radius: 17px; background: #e9e4d4; }
  @media (orientation: portrait) { #bs { top: calc(75vw + 14px); } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.87.0/phaser.min.js"></script>
</head>
<body>
<div id="game-root"></div>
<div class="keys">
  <span><b>Jugador 1</b> · mover W A S D · golpe U · salto I · especial O · empezar Enter</span>
  <span><b>Jugador 2</b> · mover flechas · golpe R · salto T · especial Y · entrar con 2</span>
</div>
<div id="pad">
  <div id="joy"><div id="knob"></div></div>
  <div class="btn" id="b1" data-k="u">GOLPE</div>
  <div class="btn" id="b2" data-k="i">SALTO</div>
  <div class="btn" id="b3" data-k="o">ESPECIAL</div>
  <div class="btn" id="bs" data-k="Enter">START</div>
</div>
<script src="game.js"></script>
<script>
(() => {
  const touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches || /[?&]touch=1/.test(location.search);
  if (!touch) return;
  document.documentElement.classList.add('touch');
  // el juego lee teclas del gabinete: cada control en pantalla simula la tecla del jugador 1
  const send = (t, k) => window.dispatchEvent(new KeyboardEvent(t, { key: k }));
  const stop = (e) => e.preventDefault(), cap = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch (x) {} };
  // sin zoom ni arrastre de página: ni pellizco, ni doble toque, ni gestos de Safari
  ['contextmenu', 'touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach((t) => document.addEventListener(t, stop, { passive: false }));
  document.querySelectorAll('.btn').forEach((b) => {
    const k = b.dataset.k;
    const up = (e) => { stop(e); if (b.classList.contains('on')) { b.classList.remove('on'); send('keyup', k); } };
    b.addEventListener('pointerdown', (e) => { stop(e); b.classList.add('on'); send('keydown', k); cap(b, e); });
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  });
  const joy = document.getElementById('joy'), knob = document.getElementById('knob'), dir = { w: 0, a: 0, s: 0, d: 0 };
  let id = null;
  const set = (k, on) => { if (dir[k] != on) { dir[k] = on; send(on ? 'keydown' : 'keyup', k); } };
  const move = (e) => {
    const r = joy.getBoundingClientRect(), m = r.width / 2;
    const dx = e.clientX - r.left - m, dy = e.clientY - r.top - m, l = Math.hypot(dx, dy) || 1, f = Math.min(l, m * 0.62) / l, t = m * 0.3;
    knob.style.transform = 'translate(' + dx * f + 'px,' + dy * f + 'px)';
    set('a', dx < -t); set('d', dx > t); set('w', dy < -t); set('s', dy > t);
  };
  const end = (e) => { if (e.pointerId !== id) return; id = null; knob.style.transform = ''; 'wasd'.split('').forEach((k) => set(k, false)); };
  joy.addEventListener('pointerdown', (e) => { stop(e); id = e.pointerId; move(e); cap(joy, e); });
  joy.addEventListener('pointermove', (e) => { if (e.pointerId === id) move(e); });
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
})();
</script>
</body>
</html>
